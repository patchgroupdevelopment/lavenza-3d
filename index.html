<title>Lavenza 3D gəzinti</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600&display=swap">
<style>
body { margin: 0; }

/* Layout: tam ekran 3D səhnə; üstdə görünüş düymələri, aşağıda kömək və hərəkət düymələri. */
:root {
  --bg: #e9e4dc; --ink: #2b2a28; --muted: #6f6a63; --panel: rgba(250, 247, 242, .88); --line: rgba(43, 42, 40, .14);
  --accent: #8a6a3a; --accent-ink: #fff;
  --ui: "Noto Sans", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #1b1a19; --ink: #f1ece4; --muted: #b3aca2; --panel: rgba(30, 29, 28, .86); --line: rgba(241, 236, 228, .16);
  --accent: #c9a868; --accent-ink: #1b1a19; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #1b1a19; --ink: #f1ece4; --muted: #b3aca2; --panel: rgba(30, 29, 28, .86); --line: rgba(241, 236, 228, .16);
  --accent: #c9a868; --accent-ink: #1b1a19; color-scheme: dark }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--ui); overflow: hidden; }
#app { position: fixed; inset: 0; }
canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
canvas:active { cursor: grabbing; }
.bar { position: fixed; left: 0; right: 0; top: 0; padding: calc(10px + env(safe-area-inset-top, 0px)) 16px 10px;
  display: flex; gap: 10px; align-items: center; pointer-events: none; }
.brand { pointer-events: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px;
  backdrop-filter: blur(8px); white-space: nowrap; }
.brand b { font-weight: 600; letter-spacing: .02em; }
.brand span { color: var(--muted); font-size: 12px; margin-left: 6px; }
.views { pointer-events: auto; display: flex; gap: 6px; overflow-x: auto; min-width: 0; padding: 2px; scrollbar-width: none; }
.views::-webkit-scrollbar { display: none; }
.views button, .pad button, .tog { font: 600 13px var(--ui); color: var(--ink); background: var(--panel); border: 1px solid var(--line);
  border-radius: 999px; padding: 8px 13px; white-space: nowrap; cursor: pointer; backdrop-filter: blur(8px); }
.views button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.help { position: fixed; left: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); max-width: min(420px, calc(100% - 200px));
  background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; font-size: 12.5px; line-height: 1.5;
  color: var(--muted); backdrop-filter: blur(8px); }
.help b { color: var(--ink); font-weight: 600; }
.help .x { display: block; margin-top: 6px; font: 600 12px var(--ui); color: var(--accent); background: none; border: 0; padding: 0; cursor: pointer; }
.pad { position: fixed; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); display: grid;
  grid-template-columns: repeat(3, 46px); grid-template-rows: repeat(2, 46px); gap: 6px; }
.pad button { padding: 0; border-radius: 12px; font-size: 18px; user-select: none; -webkit-user-select: none; touch-action: none; }
.pad .f { grid-column: 2; grid-row: 1; } .pad .l { grid-column: 1; grid-row: 2; } .pad .b { grid-column: 2; grid-row: 2; }
.pad .r { grid-column: 3; grid-row: 2; }
.tog { position: fixed; right: 16px; top: calc(62px + env(safe-area-inset-top, 0px)); font-size: 12px; padding: 6px 11px; }
.pad[hidden] { display: none !important; }
@media (max-width: 640px) { .brand span { display: none; } .help { max-width: calc(100% - 200px); font-size: 11px; padding: 8px 10px; } }
</style>

  });
  const top = document.createElement('button'); top.type = 'button'; top.textContent = 'Yuxarıdan'; top.setAttribute('aria-pressed', 'false');
  top.addEventListener('click', () => { st.mode = 'orbit'; setCeiling(true); document.getElementById('pad').hidden = true; select(top); });
  views.appendChild(top); btns.push(top);
  select(btns[0]); unstick();

  // ---- siçan / barmaq
  const cv = renderer.domElement;
  let drag = null, pinch = null;
  cv.addEventListener('pointerdown', e => { drag = { x: e.clientX, y: e.clientY, id: e.pointerId }; cv.setPointerCapture(e.pointerId); });
  cv.addEventListener('pointermove', e => {
    if (!drag || e.pointerId !== drag.id || pinch) return;
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y; drag.x = e.clientX; drag.y = e.clientY;
    if (st.mode === 'walk') { st.yaw -= dx * 0.22; st.pitch = Math.max(-75, Math.min(75, st.pitch + dy * 0.18)); }
    else { st.az -= dx * 0.3; st.el = Math.max(15, Math.min(88, st.el + dy * 0.25)); }
  });
  const end = () => { drag = null; };
  cv.addEventListener('pointerup', end); cv.addEventListener('pointercancel', end);
  cv.addEventListener('wheel', e => { e.preventDefault();
    if (st.mode === 'orbit') st.dist = Math.max(4, Math.min(40, st.dist * (1 + Math.sign(e.deltaY) * 0.1)));
    else { const yr = st.yaw * Math.PI / 180; const s = -Math.sign(e.deltaY) * 30; move(Math.sin(yr) * s, Math.cos(yr) * s); } }, { passive: false });
  cv.addEventListener('touchstart', e => { if (e.touches.length === 2) pinch = Math.hypot(e.touches[0].clientX - e.touches[1].clientX,
    e.touches[0].clientY - e.touches[1].clientY); }, { passive: true });
  cv.addEventListener('touchmove', e => { if (pinch && e.touches.length === 2 && st.mode === 'orbit') {
    const d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
    st.dist = Math.max(4, Math.min(40, st.dist * pinch / d)); pinch = d; } }, { passive: true });
  cv.addEventListener('touchend', e => { if (e.touches.length < 2) pinch = null; });

  // ---- klaviatura və düymələr
  const map = { KeyW: 'f', ArrowUp: 'f', KeyS: 'b', ArrowDown: 'b', KeyA: 'sl', KeyD: 'sr', ArrowLeft: 'l', ArrowRight: 'r', KeyQ: 'l', KeyE: 'r' };
  window.addEventListener('keydown', e => { if (map[e.code]) { st.keys[map[e.code]] = true; e.preventDefault(); } });
  window.addEventListener('keyup', e => { if (map[e.code]) st.keys[map[e.code]] = false; });
  document.querySelectorAll('.pad button').forEach(b => {
    const k = b.dataset.k;
    b.addEventListener('pointerdown', e => { e.preventDefault(); st.keys[k] = true; b.setPointerCapture(e.pointerId); });
    const up = () => { st.keys[k] = false; };
    b.addEventListener('pointerup', up); b.addEventListener('pointercancel', up); b.addEventListener('lostpointercapture', up);
  });

  // ---- dövr
  function resize() { const w = app.clientWidth, h = app.clientHeight; renderer.setSize(w, h, false); camera.aspect = w / h;
    camera.updateProjectionMatrix(); }
  window.addEventListener('resize', resize); resize();
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    if (st.mode === 'walk') {
      const K = st.keys, sp = 140 * dt, yr = st.yaw * Math.PI / 180;
      const fx = Math.sin(yr), fy = Math.cos(yr);
      let mx = 0, my = 0;
      if (K.f) { mx += fx; my += fy; } if (K.b) { mx -= fx; my -= fy; }
      if (K.sr) { mx += fy; my -= fx; } if (K.sl) { mx -= fy; my += fx; }
      if (mx || my) { const l = Math.hypot(mx, my); move(mx / l * sp, my / l * sp); }
      if (K.l) st.yaw -= 70 * dt; if (K.r) st.yaw += 70 * dt;
    } else {
      if (st.keys.l) st.az -= 50 * dt; if (st.keys.r) st.az += 50 * dt;
    }
    place(); renderer.render(scene, camera); requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>

</body>
</html>
